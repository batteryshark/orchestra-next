function paint(element,html,key){

function profilePayload(form){const f=new FormData(form);let effort=String(f.get('effort_pick')||'');if(effort==='__custom__')effort=String(f.get('effort_custom')||'').trim();const body={name:String(f.get('name')||'').trim(),runtime_id:f.get('runtime_id'),model:f.get('model')||null,effort:effort||null,tier:Number(f.get('tier')),bias:f.get('bias')||'normal',runway_source_id:f.get('runway_source_id')||null,note:f.get('note')||null,enabled:f.get('enabled')==='on'},env=replacementJSON(f.get('env'),'Environment'),config=replacementJSON(f.get('config'),'Configuration');if(env!==undefined){if(Object.values(env).some(value=>typeof value!=='string'))throw new Error('Environment values must be strings.');body.env=env}if(config!==undefined)body.config=config;return body}
function profileLine(p){return [p.model||'no model',p.effort,(state.runtimes.find(r=>r.id===p.runtime_id)||{}).name].filter(Boolean).join(' · ')}
function renderProfiles(){loadDiscovery();$('content').innerHTML=`<div class="toolbar"><button data-new-profile class="primary" ${state.runtimes.length?'':'disabled'}>New profile</button><button data-discover-models="false">Discover harness models</button><button data-discover-models="true">Include host-local models</button></div><p class="small muted">Discovery runs on the Orchestra host and never changes a profile automatically.</p><div class="panes">${state.profiles.map(p=>`<section class="pane"><div><h2>${esc(p.name)}</h2><p class="pane-desc mono">${esc(profileLine(p))}</p></div><div class="pane-body"><div class="tags">${p.enabled===false?'<span class="pill warn">disabled</span>':''}<span class="pill">${esc(TIERS[p.tier]||`Tier ${p.tier}`)}</span>${biasChip(p.bias)}${p.runway_hold?`<span class="pill bad" title="${esc(p.runway_hold)}">unavailable</span>`:''}<span class="pill ${p.observer_compatible?'good':'warn'}">${p.observer_compatible?'Observer ready':'Worker only'}</span><span class="pill">env ${configured(p.env_configured)}</span><span class="pill">config ${configured(p.config_configured)}</span></div><details class="profile-edit"><summary class="button">Edit</summary>${p.observer_compatible?'':`<p class="small warn">Observer unavailable: ${esc(p.observer_incompatibility||'This fleet did not report a tool-free Observer posture for this profile.')}</p>`}<form data-profile="${p.id}">${profileFields(p)}<p class="small muted mono">${esc(p.id)}</p><div class="row" style="margin-top:12px"><button class="primary">Save profile</button><button type="button" data-cancel-edit>Cancel</button></div></form></details></div></section>`).join('')||'<div class="card empty">No profiles configured. Create a runtime first, then an explicit profile.</div>'}</div>`}
function discoveryCard(title,result,body){return `<section class="card"><div class="row"><h3 class="grow">${esc(title)}</h3>${result?.error?'<span class="pill warn">error</span>':''}</div>${result?.error?`<p class="error">${esc(result.error)}</p>`:body||'<p class="muted">No models returned.</p>'}</section>`}
function renderDiscovery(d){const runtimes=d.runtimes||{},open=Object.entries(runtimes.opencode?.data||{}).map(([provider,models])=>`<div><b>${esc(provider)}</b><div class="tags">${(models||[]).map(x=>`<span class="pill mono">${esc(x)}</span>`).join('')}</div></div>`).join(''),codex=(runtimes.codex?.data||[]).map(x=>`<div><b class="mono">${esc(x.model)}</b><div class="small muted">${esc((x.efforts||[]).join(', ')||'No effort levels')}${x.default_effort?` · default ${esc(x.default_effort)}`:''}</div></div>`).join(''),reasonix=(runtimes.reasonix?.data||[]).map(x=>`<div><b>${esc(x.provider)}</b><div class="tags">${(x.models||[]).map(model=>`<span class="pill mono">${esc(model)}</span>`).join('')}</div><div class="small muted">${esc((x.efforts||[]).join(', ')||'No effort levels')}${x.default_effort?` · default ${esc(x.default_effort)}`:''}</div></div>`).join(''),local=(d.local_models||[]).map(x=>`<div class="row"><b class="grow mono">${esc(x.id)}</b><span class="pill">${esc(x.source)}</span></div>`).join('');return `<h2>Available models</h2><p class="muted">${d.local_requested?'Harness catalogs and models served on the Orchestra host.':'Harness catalogs only. Host-local inference was not probed.'}</p><div class="grid">${discoveryCard('Codex',runtimes.codex,codex)}${discoveryCard('OpenCode',runtimes.opencode,open)}${discoveryCard('Reasonix',runtimes.reasonix,reasonix)}${discoveryCard('Claude',runtimes.claude,'')}</div><section class="card" style="margin-top:12px"><h3>Host-local inference</h3>${local||`<p class="muted">${d.local_requested?'No local models returned.':'Not requested.'}</p>`}</section><p class="small muted">Discovery is read-only. Copy a model into a profile explicitly.</p>`}
function showInfoModal(html){$('modal-body').innerHTML=html+'<div class="dialog-actions"><button class="primary" value="cancel">Done</button></div>';$('modal-form').onsubmit=null;$('modal').showModal()}
async function loadDiscovery(){if(state.discovery||discovering)return;discovering=true;try{state.discovery=await api('/api/v2/profile-discovery?local=false');if(state.view==='profiles'){renderProfiles();bindActions()}}catch{state.discovery={runtimes:{}}}finally{discovering=false}}
async function discoverModels(local){try{showToast('Discovering models on the Orchestra host…');state.discovery=await api(`/api/v2/profile-discovery?local=${local}`);showInfoModal(renderDiscovery(state.discovery));if(state.view==='profiles'){renderProfiles();bindActions()}}catch(error){showToast(error.message)}}
function runwayWindows(windows=[]){return windows.map(w=>{const known=w.remaining_percent!=null||w.remaining!=null,percent=known?Math.max(0,Math.min(100,Number(w.remaining_percent??w.remaining))):null,reset=until(w.resets_at),models=Object.entries(w.per_model||{}).map(([model,value])=>`<span class="pill">${esc(model)} ${esc(value?.remaining_percent??value)}%</span>`).join(''),note=w.stale?esc(w.stale_reason||'stale reading'):reset?`resets in ${esc(reset)}`:'';return `<div><div class="row small"><b class="grow">${esc(w.name||w.window)}</b><span>${percent==null?'Unknown':`${percent}%`}${note?` · ${note}`:''}</span></div><div class="window"><i class="${percent===0?'zero':percent!=null&&percent<20?'low':''}" style="width:${percent??0}%"></i></div>${models?`<div class="tags" style="margin-top:6px">${models}</div>`:''}</div>`}).join('')||'<p class="muted">No current windows.</p>'}
function runwayBalance(s){const money=currency(s.remaining,s.unit),good=until(s.credits?.expires_at),lines=[];if(money)lines.push(`<div class="row small"><span class="grow muted">Account balance</span><b>${esc(money)}</b></div>`);if(s.credits&&(s.credits.text||s.credits.count!=null))lines.push(`<div class="small"><span class="muted">Credits · </span>${esc(s.credits.text||s.credits.count)}</div>`+(good?`<div class="small muted">Good for ${esc(good)}</div>`:''));return lines.length?`<div class="stack" style="gap:3px;margin:10px 0">${lines.join('')}</div>`:''}
function renderRunway(){$('content').innerHTML=`<div class="toolbar"><button class="primary" data-new-runway>New source</button></div><p class="small muted">Sources are named provider/account/lane capacity feeds. Their command and configuration stay private on the Orchestra host.</p><div class="grid">${state.runway.map(s=>`<article class="card"><div class="row"><div class="grow"><h2>${esc(s.name||s.provider)}</h2><div class="small muted">${esc([s.provider,s.account,s.lane].filter(Boolean).join(' · '))}</div></div><span class="pill ${s.enabled===false?'bad':s.fresh===false?'warn':'good'}">${s.enabled===false?'disabled':s.fresh===false?'stale':s.status||'current'}</span></div><div class="tags" style="margin-bottom:12px"><span class="pill">${esc(s.adapter)}</span><span class="pill">argv ${s.argv_configured?'configured':'unset'}</span><span class="pill">config ${s.config_configured?'configured':'unset'}</span></div>${runwayBalance(s)}<div class="stack">${runwayWindows(s.windows)}</div><p class="small muted">Observed ${age(s.observed_at)}${s.burn_rate!=null?` · burn ${esc(s.burn_rate)}`:''}</p><div class="tags">${(s.linked_profile_ids||[]).map(id=>`<span class="pill">${esc(nameOf(state.profiles,id))}</span>`).join('')}</div>${s.history?.length?`<details style="margin-top:12px"><summary>Recent observations</summary><div class="stack" style="margin-top:8px">${s.history.slice(0,10).map(h=>`<div class="small muted">${age(h.observed_at)} · ${(h.windows||[]).map(w=>`${esc(w.name)} ${w.remaining_percent==null?'unknown':`${esc(w.remaining_percent)}%`}${until(w.resets_at)?` · resets in ${esc(until(w.resets_at))}`:''}`).join(' · ')||currency(h.remaining,h.unit)||h.credits?.text||'no windows'}</div>`).join('')}</div></details>`:''}<div class="row" style="margin-top:12px"><button data-refresh-runway="${s.id}">Refresh</button><button data-edit-runway="${s.id}">Edit</button><button data-toggle-runway="${s.id}" data-enabled="${s.enabled!==false}">${s.enabled===false?'Enable':'Disable'}</button><button class="danger" data-archive-runway="${s.id}">Archive</button></div></article>`).join('')||'<div class="card empty">No runway sources configured. Profiles without a source continue to run.</div>'}</div>`}
function runwayAdapterOptions(selected){return ['claude','codex','deepseek','kimi','minimax','xai','command'].map(value=>`<option value="${value}" ${value===selected?'selected':''}>${value}</option>`).join('')}
function runwaySourceFields(source){const creating=!source,s=source||{name:'',provider:'',account:'',lane:'',adapter:'codex',enabled:true};return `<label>Name</label><input name="name" value="${esc(s.name)}" required><div class="row"><div class="grow"><label>Provider</label><input name="provider" value="${esc(s.provider)}" required></div><div class="grow"><label>Account</label><input name="account" value="${esc(s.account||'')}"></div><div class="grow"><label>Lane</label><input name="lane" value="${esc(s.lane||'')}"></div></div><label>Adapter</label><select name="adapter" id="runway-adapter">${runwayAdapterOptions(s.adapter)}</select><div id="runway-argv-fields"><label>Command argument vector</label><textarea name="argv" class="mono" placeholder="/usr/local/bin/capacity-check&#10;--json"></textarea><p class="small muted">One non-empty argument per line. ${creating?'A command adapter requires argv.':'Blank preserves the private host value; changing from command to a built-in clears it atomically.'}</p></div><label>Replacement configuration (JSON object)</label><textarea name="config" class="mono" placeholder='{"region":"us-east"}'></textarea><p class="small muted">${creating?'Optional.':'Blank preserves the private host value.'} Secret-shaped keys such as token, key, password, secret, or credentials are rejected.</p>${source?`<div class="tags"><span class="pill">Host argv ${source.argv_configured?'configured':'unset'}</span><span class="pill">Host config ${source.config_configured?'configured':'unset'}</span></div>`:''}<label><input style="width:auto" type="checkbox" name="enabled" ${s.enabled!==false?'checked':''}> Enabled</label>`}
function syncRunwayAdapter(){const adapter=$('runway-adapter'),fields=$('runway-argv-fields');if(fields)fields.hidden=adapter?.value!=='command'}
function openRunwaySourceEditor(source){const creating=!source;openModal(`<h2>${creating?'New runway source':`Edit ${esc(source.name)}`}</h2>${runwaySourceFields(source)}`,async()=>{try{const f=new FormData($('modal-form')),adapter=String(f.get('adapter')),rawArgv=String(f.get('argv')||''),argv=rawArgv.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),body={request_id:requestID('runway-source'),name:String(f.get('name')||'').trim(),provider:String(f.get('provider')||'').trim(),account:String(f.get('account')||'').trim(),lane:String(f.get('lane')||'').trim(),adapter,enabled:f.get('enabled')==='on'},config=replacementJSON(f.get('config'),'Configuration');if(adapter==='command'){if(rawArgv.trim())body.argv=argv;else if(creating||source.adapter!=='command')throw new Error('The command adapter requires at least one argument.')}else if(source?.adapter==='command')body.argv=[];if(config!==undefined)body.config=config;if(await mutate(creating?'/api/v2/runway-sources':`/api/v2/runway-sources/${source.id}`,body,'Runway source saved',creating?'POST':'PATCH'))closeModal()}catch(error){showToast(error.message)}});$('runway-adapter').onchange=syncRunwayAdapter;syncRunwayAdapter()}
function fleetHTML(){const scheduler=state.snapshot?.scheduler||{},daemon=state.snapshot?.daemon||{};return `<section class="card compact" style="margin-bottom:12px"><div class="row"><b class="grow">Scheduler</b><span class="small muted">${scheduler.paused?'Paused':'Admitting FIFO'} · ${esc(scheduler.active??0)} active, ${esc(scheduler.queued??0)} queued · daemon ${esc(daemon.status||'healthy')}, ticked ${age(daemon.last_tick_at)}</span><button data-scheduler="${scheduler.paused?'resume':'pause'}" class="${scheduler.paused?'primary':''}">${scheduler.paused?'Resume':'Pause'}</button></div></section><section class="card compact" style="margin-bottom:12px"><div class="row"><h2 class="grow">Runtimes</h2><button data-new-runtime>Add</button></div><div class="stack" style="margin-top:8px">${state.runtimes.map(r=>`<div class="row"><div class="grow"><b>${esc(r.name)}</b><div class="small muted">${esc(r.kind)} · ${['exec','acp'].includes(r.kind)?`${esc((r.argv||[]).length)} argv parts`:'built in'} · config ${configured(r.config_configured)}</div></div><span class="pill ${r.enabled===false?'bad':'good'}">${r.enabled===false?'disabled':'enabled'}</span><button data-edit-runtime="${r.id}">Edit</button></div>`).join('')||'<p class="muted">No runtimes configured.</p>'}</div></section>`}
function fleetSetting(key,fallback){return state.settings.find(x=>x.key===key)?.value??fallback}
function fleetSettingsHTML(){return `<form class='card compact' id='fleet-settings' style='margin-bottom:12px'><div class='row'><h2 class='grow'>Fleet settings</h2><button class='primary'>Save</button></div><div class='row'><div class='grow'><label>Instance name</label><input name='instance_name' required maxlength='100' value='${esc(fleetSetting('instance_name',state.snapshot?.instance?.name||'Orchestra'))}'></div><div><label>Maximum active runs</label><input name='max_active_runs' type='number' min='1' max='256' required value='${esc(fleetSetting('max_active_runs',state.snapshot?.scheduler?.max_active||8))}'></div></div><div class='row'><div><label>Delegation depth</label><input name='delegation_max_depth' type='number' min='0' max='10' required value='${esc(fleetSetting('delegation_max_depth',2))}'></div><div><label>Children per run</label><input name='delegation_max_children' type='number' min='1' max='100' required value='${esc(fleetSetting('delegation_max_children',3))}'></div><div><label>Active children per run</label><input name='delegation_max_active_children' type='number' min='1' max='100' required value='${esc(fleetSetting('delegation_max_active_children',3))}'></div></div><p class='small muted'>These bounds apply to new admissions. A run may raise its own child and tier ceilings when dispatched.</p></form>`}
async function saveFleetSettings(form){const f=new FormData(form),desired={instance_name:String(f.get('instance_name')||'').trim(),max_active_runs:Number(f.get('max_active_runs')),delegation_max_depth:Number(f.get('delegation_max_depth')),delegation_max_children:Number(f.get('delegation_max_children')),delegation_max_active_children:Number(f.get('delegation_max_active_children'))};try{for(const [key,value] of Object.entries(desired)){const current=state.settings.find(x=>x.key===key);if(current?.value===value)continue;const body={request_id:requestID('setting'),key,value};if(current?.revision!=null)body.expected_revision=current.revision;await api('/api/v2/settings',{method:'PATCH',body})}showToast('Fleet settings saved');await refresh({quiet:true})}catch(error){showToast(error.message)}}
function settingsTabs(){return `<div class="subtabs">${[['fleet','Fleet'],['logs','Logs'],['pairing','Pairing and access']].map(([id,label])=>`<button data-settings-tab="${id}" class="${state.settingsTab===id?'active':''}">${label}</button>`).join('')}</div>`}
function deviceRow(d){return `<div class="list-row"><div class="grow"><b>${esc(d.label)}</b><div class="small muted mono">${esc(d.id)}</div></div><span class="small muted seen">seen ${age(d.last_used_at)}</span>${d.revoked_at?'<span class="pill bad">revoked</span>':`<button class="danger" data-revoke-device="${esc(d.id)}">Revoke</button>`}</div>`}
function tokenRow(t){return `<div class="list-row"><div class="grow"><b>${esc(t.label)}</b><div class="small muted">${esc((t.authorities||[]).join(', '))}</div></div>${t.revoked_at?'<span class="pill bad">revoked</span>':`<button class="danger" data-revoke-token="${esc(t.id)}">Revoke</button>`}</div>`}
function pane(title,description,body){return `<section class="pane"><div><h2>${esc(title)}</h2><p class="pane-desc">${esc(description)}</p></div><div class="pane-body">${body}</div></section>`}
function pairingHTML(){return `<div class="card panes">
${pane('Pair a client','Mint a short-lived one-time code for another device. Scan the QR code instead of retyping it.',
  `<form id="pair-create"><div class="row"><input class="grow" name="label" required placeholder="Studio iPhone"><button class="primary">Mint code</button></div></form><div id="pair-result">${state.pairing?qrSVG(state.pairing.pairing_uri||state.pairing.code)+`<pre>${esc(state.pairing.code)}${state.pairing.pairing_uri?`\n${esc(state.pairing.pairing_uri)}`:''}</pre><div class="row"><span class="grow small muted">Expires ${esc(state.pairing.expires_at||'soon')}.</span><button type="button" data-clear-pairing>Done</button></div>`:''}</div>`)}
${pane('Redeem a code','Pair this browser using a code minted somewhere else.',
  `<form id="pair-redeem"><div class="row"><input class="grow" name="code" required autocomplete="one-time-code" placeholder="Code or pairing URI"><button>Redeem</button></div></form>`)}
${pane('Paired devices','Every device holding an operator credential for this fleet.',
  state.devices.map(deviceRow).join('')||'<p class="muted small">Device administration is unavailable for this credential.</p>')}
${pane('Service tokens','Long-lived credentials for integrations. Each one carries only the authorities you grant.',
  `<form id="service-token-form"><div class="row"><input class="grow" name="name" required placeholder="Research integration"><button>Create</button></div><div class="tags" style="margin-top:9px">${['read','dispatch','control','answer'].map(a=>`<label class="pill" style="margin:0"><input style="width:auto" type="checkbox" name="authorities" value="${a}" ${a==='read'?'checked':''}> ${a}</label>`).join('')}</div></form><div id="service-token-result">${state.newToken?`<p class="small muted">Copy this now. It is not shown again.</p><pre>${esc(state.newToken)}</pre><button type="button" data-clear-token>Done</button>`:''}</div>${state.tokens.length?`<div style="margin-top:10px">${state.tokens.map(tokenRow).join('')}</div>`:''}`)}
</div>`}
function fleetTabHTML(){const observer=state.snapshot?.observer||{},storage=state.snapshot?.storage||{},observerProblem=observerIssue(observer.profile_id);return fleetSettingsHTML()+fleetHTML()+`<div class="grid">
    <form class="card compact" id="observer-form"><div class="row"><h2 class="grow">Observer</h2><button class="primary" data-observer-save ${observerProblem?'disabled':''}>Save</button></div><label>Default Observer profile</label><select name="profile_id"><option value="" ${observer.profile_id?'':'selected'}>Disabled</option>${observerOptions(observer.profile_id)}</select>${observerProblem?`<p class="small bad">Configured Observer unavailable: ${esc(observerProblem)} Choose a replacement or disable it.</p>`:''}<div class="row"><div><label>Concurrency</label><input name="concurrency" type="number" min="1" max="8" value="${esc(observer.concurrency??1)}"></div><div><label>First check (s)</label><input name="first_check_seconds" type="number" min="60" value="${esc(observer.first_check_seconds??300)}"></div><div><label>Min events</label><input name="minimum_events" type="number" min="1" value="${esc(observer.minimum_events??5)}"></div><div><label>Later checks (s)</label><input name="subsequent_check_seconds" type="number" min="60" value="${esc(observer.subsequent_check_seconds??1800)}"></div></div><label>Authority</label><select name="authority">${[['advisory','Observe only'],['tell_only','May redirect'],['correct_then_stop','Redirect, then stop']].map(([value,label])=>`<option value="${value}" ${(observer.authority||'correct_then_stop')===value?'selected':''}>${label}</option>`).join('')}</select></form>
    <section class="card compact"><div class="row"><h2 class="grow">Storage</h2><button data-prune-plan>Prune plan</button></div><div class="small muted" style="margin-top:6px">Database ${esc(storage.database_bytes??'—')} · logs ${esc(storage.log_bytes??'—')} · artifacts ${esc(storage.artifact_bytes??'—')} · checkpoints ${esc(storage.checkpoint_bytes??'—')}</div><div class="small muted mono" style="margin-top:8px">Instance ${esc(state.instanceID)} · API v2 · ${location.protocol==='https:'?'TLS':'private network required'}</div></section>
  </div>`}
function logsHTML(){return `<section class="card compact"><div class="row"><h2 class="grow">Service log</h2><span class="pill good" id="service-log-state">live</span><button id="service-log-refresh">Refresh</button></div><p class="small muted" style="margin:6px 0 0">A bounded live tail of the Orchestra service. Each run's own harness output stays in its Logs tab.</p><pre id="service-log" style="height:calc(100dvh - 320px);min-height:280px;margin-top:8px">Loading service log…</pre></section>`}
function renderSettings(){
  $('content').innerHTML=settingsTabs()+({pairing:pairingHTML,logs:logsHTML}[state.settingsTab]||fleetTabHTML)();
  document.querySelectorAll('[data-settings-tab]').forEach(el=>el.onclick=()=>{state.settingsTab=el.dataset.settingsTab;renderSettings();bindActions()});

    const score=qrPenalty(view,size);
    if(best===null||score<best.score)best={score,view}}
  return best.view}
function qrSVG(text){let grid;try{grid=qrMatrix(text)}catch{return ''}
  const n=grid.length,quiet=4,size=n+quiet*2;let path='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(grid[r][c])path+=`M${c+quiet} ${r+quiet}h1v1h-1z`;
  return `<svg class="qr" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" role="img" aria-label="Pairing code"><rect width="${size}" height="${size}" fill="#fff"/><path d="${path}" fill="#000"/></svg>`}
// --- end QR encoder ---
function pickDirectory(start){return new Promise(resolve=>{
  const dialog=$('picker'),body=$('picker-body');let here=null,done=false;
  const finish=value=>{if(done)return;done=true;dialog.close();resolve(value)};
  const draw=d=>{here=d.path;body.innerHTML=`<h2>Choose a directory</h2><div class="row"><input class="mono grow" id="picker-path" value="${esc(d.path)}"><button type="button" id="picker-go">Go</button></div><div class="stack picker-list">${d.parent?`<button type="button" class="picker-row" data-dir="${esc(d.parent)}">📁 ..</button>`:''}${d.directories.map(x=>`<button type="button" class="picker-row" data-dir="${esc(x.path)}">📁 ${esc(x.name)}</button>`).join('')||'<p class="muted small">No subdirectories here.</p>'}</div>${d.truncated?'<p class="small muted">Only the first 500 subdirectories are listed. Type a path to go deeper.</p>':''}<div class="dialog-actions"><button type="button" id="picker-cancel">Cancel</button><button type="button" class="primary" id="picker-use">Use this directory</button></div>`;
    body.querySelectorAll('[data-dir]').forEach(el=>el.onclick=()=>load(el.dataset.dir));
    $('picker-go').onclick=()=>load($('picker-path').value);
    $('picker-cancel').onclick=()=>finish(null);
    $('picker-use').onclick=()=>finish($('picker-path').value.trim()||here)};
  const load=async where=>{try{draw(await api(`/api/v2/host-directories${where?`?path=${encodeURIComponent(where)}`:''}`))}catch(error){showToast(error.message)}};
  dialog.onclose=()=>finish(null);
  dialog.showModal();load(String(start||'').trim()||null)})}
document.addEventListener('click',async e=>{const button=e.target.closest?.('[data-pick]');if(!button)return;e.preventDefault();const field=$(button.dataset.pick),chosen=await pickDirectory(field?.value);if(chosen&&field)field.value=chosen});
function openDispatch(){openModal(`<h2>Dispatch a run</h2><label>Title <span class="muted">(optional metadata)</span></label><input id="new-title" placeholder="Research the vendor landscape"><div class="row"><div class="grow"><label>Group</label><select id="new-group">${filterOptions(state.groups,'')}</select></div><div class="grow"><label>Profile</label><select id="new-profile">${filterOptions(state.profiles.filter(p=>p.enabled!==false),'')}</select></div></div><label>Context / request</label><textarea id="new-context" required placeholder="What should this run do? Include any context it needs."></textarea><label>Working directory <span class="muted">(optional; overrides the group default)</span></label><div class="row"><input id="new-cwd" class="mono grow" placeholder="/Users/me/Projects/research"><button type="button" data-pick="new-cwd">Browse…</button></div><div class="row"><div class="grow"><label>Max child workers</label><input id="new-max-children" type="number" min="1" max="100" placeholder="fleet default"></div><div class="grow"><label>Max delegated tier</label><select id="new-max-tier"><option value="">Own tier (default)</option>${[1,2,3].map(x=>`<option value="${x}">${x} · ${TIERS[x]}</option>`).join('')}</select></div></div><p class="small muted">The path is resolved on the Orchestra host and is never returned to clients. Raise the ceilings to let this run convene a wider or higher-tier panel of children.</p>`,async()=>{const body={request_id:requestID('run'),group:$('new-group').value,profile:$('new-profile').value,context:$('new-context').value.trim(),requested_by:'web'},title=$('new-title').value.trim(),cwd=$('new-cwd').value.trim(),children=$('new-max-children').value.trim(),tier=$('new-max-tier').value;if(title)body.title=title;if(cwd)body.cwd=cwd;if(children)body.max_children=Number(children);if(tier)body.max_child_tier=Number(tier);try{const d=await api('/api/v2/runs',{method:'POST',body});closeModal();showToast(`${d.created?'Created':'Reused'} ${display(d.run)}`);await refresh({quiet:true});openRun(d.run.id)}catch(error){showToast(error.message)}})}
document.addEventListener('change',e=>{if(e.target.name==='effort_pick'){const custom=e.target.form?.elements.effort_custom;if(custom)custom.hidden=e.target.value!=='__custom__'}});
document.addEventListener('input',e=>{if(e.target.name!=='model'||!e.target.form)return;const form=e.target.form,sel=form.elements.effort_pick,box=form.elements.effort_custom;if(!sel)return;const current=sel.value==='__custom__'?String(box?.value||''):sel.value,efforts=discoveredEfforts(e.target.value),custom=Boolean(current)&&!efforts.includes(current);sel.innerHTML=`<option value="">—</option>${efforts.map(x=>`<option value="${esc(x)}" ${!custom&&x===current?'selected':''}>${esc(x)}</option>`).join('')}<option value="__custom__" ${custom?'selected':''}>Custom</option>`;if(box){box.hidden=!custom;if(custom)box.value=current}});
function setNav(visible){document.querySelector('.app').classList.toggle('nav-hidden',!visible);$('brand').setAttribute('aria-expanded',String(visible));$('nav-toggle').setAttribute('aria-expanded',String(visible));try{localStorage.setItem('orchestra.nav',visible?'open':'hidden')}catch{}}
try{if(localStorage.getItem('orchestra.hideStopped')==='false')state.hideStopped=false}catch{}
function navVisible(){try{return localStorage.getItem('orchestra.nav')==='open'}catch{return false}}
$('brand').onclick=()=>setNav(false);$('nav-toggle').onclick=()=>setNav(true);setNav(navVisible());
$('refresh').onclick=()=>refresh();$('dispatch').onclick=openDispatch;window.addEventListener('hashchange',()=>setView(location.hash.slice(1)));renderNav();setView(location.hash.slice(1)||'runs');refresh();setInterval(()=>refresh({quiet:true}),45000);setInterval(()=>{if(state.view==='settings'&&state.settingsTab==='logs')loadServiceLog()},3000);
</script>
