# Canonical Orchestra-next profile for DSH 0.1.2-alpha.3.
- id: session-persistence-jsonl
  config:
    root: !!js process.env.ORCHESTRA_NEXT_DSH_SESSION_ROOT
    compression: none
    packChunks: false

- id: session-telemetry-otel
  disabled: true

- id: user-questions
  disabled: true

- id: plan-mode
  disabled: true

- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true

- id: tool-web
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: llm-pi-ai
  config:
    providers:
      claude-subscription:
        displayName: Claude subscription sidecar
        apiKeyEnv: ORCHESTRA_NEXT_CLAUDE_PROXY_TOKEN
        api: openai-completions
        baseURL: !!js process.env.ORCHESTRA_NEXT_CLAUDE_PROXY_URL || 'http://127.0.0.1:1/v1'
        headers:
          x-opencode-claude-session: !!js process.env.ORCHESTRA_NEXT_RUN_ID || 'catalog'
        retryPolicy:
          mode: normal
          maxRetries: 0
        models:
          - id: haiku
            name: Haiku
            contextWindow: 200000
            maxTokens: 8192
          - id: sonnet
            name: Sonnet
            contextWindow: 200000
            maxTokens: 8192
          - id: opus
            name: Opus
            contextWindow: 200000
            maxTokens: 8192
          - id: fable
            name: Fable
            contextWindow: 200000
            maxTokens: 8192
            reasoningEfforts: {low: low, medium: medium, high: high, max: max}
      openai-codex:
        displayName: Codex subscription
        apiKeyEnv: OPENAI_CODEX_API_KEY
        models:
          - id: gpt-5.6-sol
            name: GPT-5.6 Sol
            contextWindow: 400000
            maxTokens: 128000
            reasoningEfforts: {low: low, medium: medium, high: high, xhigh: xhigh}
          - id: gpt-5.6-luna
            name: GPT-5.6 Luna
            contextWindow: 400000
            maxTokens: 128000
            reasoningEfforts: {low: low, medium: medium, high: high, xhigh: xhigh}

      meta:
        displayName: Meta
        apiKeyEnv: META_API_KEY
        api: openai-completions
        baseURL: https://api.meta.ai/v1
        models:
          - id: muse-spark-1.3
            name: Muse Spark 1.3
            contextWindow: 1048576
            maxTokens: 131072
            reasoningEfforts: {low: low, medium: medium, high: high}
          - id: muse-spark-1.3-contributor
            name: Muse Spark 1.3 Contributor
            contextWindow: 1048576
            maxTokens: 131072
            reasoningEfforts: {low: low, medium: medium, high: high}
      zai:
        displayName: Z.ai
        apiKeyEnv: ZAI_API_KEY
        api: openai-completions
        baseURL: https://api.z.ai/api/paas/v4
        models:
          - id: glm-5.3
            name: GLM 5.3
            contextWindow: 200000
            maxTokens: 131072
            reasoningEfforts: {low: low, medium: medium, high: high}
          - id: glm-5.3-flash
            name: GLM 5.3 Flash
            contextWindow: 200000
            maxTokens: 131072
            reasoningEfforts: {low: low, medium: medium, high: high}

- id: system-prompt
  config:
    persona: >-
      You are the resident worker for one durable Orchestra-next run. Use goals
      for multi-round work and keep the same session alive until the goal is
      complete. Use the orchestra-next CLI bridge for questions, child runs,
      artifacts, and run interaction. Never invent an answer to a blocked
      decision. Do not launch DSH subagents or workflows unless this process was
      explicitly started with Orchestra's Ralph overlay. When the run was
      dispatched with Antigravity delegation allowed, `orchestra-next delegate
      "<objective>" --model <id>` sends a bounded read-only review of the
      worktree to Google's Antigravity and returns its findings; use it for
      substantial reviews, not inner-loop questions.
