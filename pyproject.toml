[project]
name = "orchestra-next"
license = "MIT"
license-files = ["LICENSE"]
version = "3.0.0a1"
description = "Durable DSH execution for local agent fleets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
orchestra-next = "orchestra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestra"]
